<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Portfolio</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .sidebar {
      width: 320px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .chart-box {
      flex-grow: 1;
      height: 600px;
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #333;
      padding: 10px;
    }
    .card {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    h2, h3, h4 { margin-top: 0; color: #fff; }
    .green { color: #4caf50; }
  </style>
</head>
<body>

  <h2>Welcome back, <span id="username">Loading...</span></h2>

  <div class="container">
    <!-- Left Sidebar: User Details & Trade Setup -->
    <div class="sidebar">
      <div class="card">
        <h4>Invested Amount</h4>
        <h2 id="invested">$0.00</h2>
      </div>

      <div class="card">
        <h4>P&L Gain</h4>
        <h2 class="green" id="pnl">$0.00 (<span id="pnl-percent">0%</span>)</h2>
      </div>

      <div class="card">
        <h4>Trade Setup</h4>
        <h3 id="setup-name">---</h3>
        <p id="setup-desc" style="font-size: 0.9em; color: #aaa;">---</p>
      </div>
    </div>

    <!-- Right Area: TradingView Superchart Widget -->
    <div class="chart-box">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tradingview_12345" style="height:calc(100% - 32px);width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "FX:EURUSD",
            "interval": "60",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_12345"
          });
        </script>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
