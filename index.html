<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TradEaTravel Pro</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0b0e11;
      --bg-card: #181a20;
      --bg-card-hover: #1e2329;
      --border-color: #2b313a;
      --text-main: #eaecef;
      --text-muted: #848e9c;
      --green: #0ecb81;
      --green-bg: rgba(14, 203, 129, 0.12);
      --red: #f6465d;
      --red-bg: rgba(246, 70, 93, 0.12);
      --accent: #f0b90b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Overall Layout */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      flex-direction: row;
    }

    /* Sidebar Navigation Area */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow-y: auto;
      z-index: 10;
    }

    /* Compact Header / Brand */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .site-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .user-pill {
      margin-left: auto;
      font-size: 0.7rem;
      background: #2b313a;
      padding: 3px 8px;
      border-radius: 12px;
      color: var(--accent);
      font-weight: 600;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Portfolio Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* Trades Section */
    .section-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 6px var(--green);
    }

    .trades-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trade-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      transition: background 0.15s ease;
    }

    .trade-card:hover {
      background: var(--bg-card-hover);
    }

    .trade-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .symbol-name {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 700;
    }

    .badge-long { background: var(--green-bg); color: var(--green); }
    .badge-short { background: var(--red-bg); color: var(--red); }
    
    .badge-active { border: 1px solid var(--green); color: var(--green); }
    .badge-inactive { border: 1px solid var(--text-muted); color: var(--text-muted); }

    .trade-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .price-text {
      color: var(--text-muted);
      font-family: monospace;
    }

    .pnl-text {
      font-weight: 700;
      font-family: monospace;
    }

    .green { color: var(--green); }
    .red { color: var(--red); }

    /* Chart Container */
    .chart-box {
      flex-grow: 1;
      height: 100%;
      background: var(--bg-main);
    }

    /* Mobile Bottom Navigation Bar */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .mobile-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mobile-tab.active {
      color: var(--accent);
      font-weight: 700;
    }

    /* Action Buttons */
    .btn-logout {
      margin-top: auto;
      background: rgba(246, 70, 93, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
    }

    .btn-logout:hover {
      background: var(--red);
      color: white;
    }

    /* Responsive Design for Mobile */
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
        height: calc(100vh - 50px);
      }

      .sidebar {
        width: 100%;
        min-width: 100%;
        height: 100%;
        border-right: none;
      }

      .chart-box {
        display: none; /* Controlled by mobile tabs */
        width: 100%;
        height: 100%;
      }

      .mobile-nav {
        display: flex;
      }

      .chart-active .chart-box {
        display: block;
      }

      .chart-active .sidebar {
        display: none;
      }
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 14, 17, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      width: 300px;
      text-align: center;
    }

    .auth-card input {
      width: 100%;
      padding: 8px 10px;
      margin: 6px 0;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .btn-auth {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 10px;
      cursor: pointer;
    }

    .auth-toggle {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 12px;
      display: block;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTHENTICATION OVERLAY -->
  <div id="auth-modal" class="auth-overlay">
    <div class="auth-card">
      <h3 id="auth-title" style="color: var(--text-main); margin-bottom: 4px;">Sign In</h3>
      <p style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 12px;" id="auth-sub">Access your trading terminal</p>
      
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      <input type="text" id="auth-username" placeholder="Username" class="hidden">

      <button id="auth-btn" class="btn-auth">Log In</button>
      <span class="auth-toggle" id="auth-toggle">Create an account</span>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="app-container" id="app-viewport">
    
    <!-- LEFT SIDEBAR / PORTFOLIO TERMINAL -->
    <div class="sidebar">
      
      <!-- BRAND HEADER -->
      <div class="brand-header">
        <img src="images/tradeatravel.jpg" alt="Logo" class="site-logo">
        <span class="brand-title">TERMINAL</span>
        <span class="user-pill" id="username">---</span>
      </div>

      <!-- PORTFOLIO METRICS -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Invested</div>
          <div class="stat-value" id="invested">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total P&L</div>
          <div class="stat-value green" id="pnl-card">$0.00</div>
        </div>
      </div>

      <!-- LIVE POSITIONS -->
      <div class="section-title">
        <span><span class="live-dot"></span>Active Positions</span>
        <span style="font-size: 0.65rem; color: var(--text-muted);">BINANCE LIVE</span>
      </div>

      <div id="trades-container" class="trades-list">
        <!-- Live WebSocket Trades Render Here -->
      </div>

      <!-- LOGOUT BUTTON -->
      <button class="btn-logout" onclick="logout()">Log Out Terminal</button>
    </div>

    <!-- RIGHT CHART BOX -->
    <div class="chart-box">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tradingview_12345" style="height:100%;width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT", 
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#181a20",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_12345",
            "withdateranges": true,
            "hide_side_toolbar": false,
            "save_image": false,
            "details": false,
            "hotlist": false,
            "calendar": false
          });
        </script>
      </div>
    </div>
  </div>

  <!-- MOBILE NAVIGATION TABS -->
  <div class="mobile-nav">
    <div class="mobile-tab active" id="tab-positions" onclick="switchMobileTab('positions')">
      <span>POSITIONS</span>
    </div>
    <div class="mobile-tab" id="tab-chart" onclick="switchMobileTab('chart')">
      <span>CHARTS</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
