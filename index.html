<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradEaTravel</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden; /* App view feel */
    }
    
    /* Overall Layout: Sidebar and Chart */
    .app-container {
      display: flex;
      height: 100vh; /* Full screen height */
      width: 100vw; /* Full screen width */
    }
    
    /* Left Sidebar: User Details */
    .sidebar {
      width: 320px;
      background: #1c1c1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      box-sizing: border-box;
      overflow-y: auto; /* Scroll sidebar if needed */
    }
    
    /* Logo Container & Larger Image Style */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .site-logo {
      width: 95px;
      height: 95px;
      border-radius: 12px; 
      object-fit: cover;
      border: 1px solid #3a3a3e;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
      line-height: 1.2;
    }
    
    /* Right Area: Advanced Chart */
    .chart-box {
      flex-grow: 1;
      height: 100%;
      background: #121212;
    }
    
    /* Sidebar Components */
    .card {
      background: #2a2a2e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 18px;
      border: 1px solid #3a3a3e;
    }

    h2, h3, h4 { 
      margin: 0 0 8px 0; 
      color: #fff; 
    }

    h2 { font-size: 1.5rem; }
    
    h4 { 
      font-size: 0.8rem; 
      color: #aaaaaa; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    .green { color: #4caf50; }

    .welcome-header {
      padding: 15px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Left Sidebar -->
    <div class="sidebar">
      
      <!-- LOGO AREA -->
      <div class="logo-container">
        <img src="images/tradeatravel.jpg" alt="Trade & Travel Logo" class="site-logo">
        <h1 class="brand-name">Trading Database</h1>
      </div>

      <div class="welcome-header card">
        <h4>Logged In As:</h4>
        <h2 id="username">Loading...</h2>
      </div>

      <div class="card">
        <h4>Invested Amount</h4>
        <h2 id="invested">$0.00</h2>
      </div>

      <div class="card">
        <h4>P&L Gain</h4>
        <h2 class="green" id="pnl">$0.00 (<span id="pnl-percent">0%</span>)</h2>
      </div>

      <div class="card">
        <h4>Active Setup</h4>
        <h3 id="setup-name">---</h3>
        <p id="setup-desc" style="font-size: 0.9em; color: #aaa; margin: 0;">---</p>
      </div>
    </div>

    <!-- Right Area: THE SUPERCHART! -->
    <div class="chart-box">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div id="tradingview_12345" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget(
          {
            "autosize": true,
            "symbol": "CRYPTOCAP:TOTAL", 
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true, // Enables searching any symbol
            "container_id": "tradingview_12345",
            "withdateranges": true,
            "hide_side_toolbar": false, // Enables drawing tools toolbar
            "save_image": true,
            "details": true,
            "hotlist": true,
            "calendar": true,
            "news": [
              "headlines"
            ],
            "show_popup_button": true,
            "popup_width": "1000",
            "popup_height": "650",
            "studies": [
              "RSI@tv-basicstudies",
              "MASimple@tv-basicstudies"
            ]
          }
          );
          </script>
        </div>
        <!-- TradingView Widget END -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
