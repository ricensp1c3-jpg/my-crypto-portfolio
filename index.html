<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradEaTravel</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden; /* App view feel */
    }
    
    /* Overall Layout: Sidebar and Chart */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }
    
    /* Left Sidebar */
    .sidebar {
      width: 340px;
      background: #1c1c1e;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      box-sizing: border-box;
      overflow-y: auto;
    }
    
    /* Logo Area */
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .site-logo {
      width: 85px;
      height: 85px;
      border-radius: 12px; 
      object-fit: cover;
      border: 1px solid #3a3a3e;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
      line-height: 1.2;
    }
    
    /* Right Area: Chart */
    .chart-box {
      flex-grow: 1;
      height: 100%;
      background: #121212;
    }
    
    /* Sidebar Cards */
    .card {
      background: #2a2a2e;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid #3a3a3e;
    }

    h2, h3, h4 { 
      margin: 0 0 6px 0; 
      color: #fff; 
    }

    h2 { font-size: 1.4rem; }
    
    h4 { 
      font-size: 0.75rem; 
      color: #aaaaaa; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    .green { color: #4caf50; font-weight: bold; }
    .red { color: #e53935; font-weight: bold; }

    /* Trades Container Styles */
    .trades-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .trade-item {
      background: #1e1e22;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #38383c;
      font-size: 0.82rem;
    }

    .trade-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .trade-details {
      display: flex;
      justify-content: space-between;
      color: #bbbbbb;
      font-size: 0.78rem;
    }

    .badge-active {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.7rem;
    }

    .badge-inactive {
      background: rgba(229, 57, 53, 0.2);
      color: #e53935;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.7rem;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 10px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .btn:hover { background: #0056b3; }
    .btn-danger { background: #e53935; margin-top: auto; }
    .btn-danger:hover { background: #b71c1c; }

    /* Auth Modal Overlay */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: #1c1c1e;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #3a3a3e;
      width: 320px;
      text-align: center;
    }

    .auth-card input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #3a3a3e;
      background: #2a2a2e;
      color: white;
      box-sizing: border-box;
    }

    .auth-toggle {
      color: #007aff;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 15px;
      display: block;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTH MODAL -->
  <div id="auth-modal" class="auth-overlay">
    <div class="auth-card">
      <h2 id="auth-title">Welcome Back</h2>
      <p style="color: #aaa; font-size: 0.85rem; margin-bottom: 15px;" id="auth-sub">Log in to access your portfolio</p>
      
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-password" placeholder="Password">
      <input type="text" id="auth-username" placeholder="Username (for registration)" class="hidden">

      <button id="auth-btn" class="btn">Log In</button>
      
      <span class="auth-toggle" id="auth-toggle">Don't have an account? Register</span>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="app-container">
    <!-- Left Sidebar -->
    <div class="sidebar">
      
      <!-- LOGO AREA -->
      <div class="logo-container">
        <img src="images/tradeatravel.jpg" alt="Trade & Travel Logo" class="site-logo">
        <h1 class="brand-name">Trading Database</h1>
      </div>

      <div class="card">
        <h4>Logged In As:</h4>
        <h2 id="username">Loading...</h2>
      </div>

      <div class="card">
        <h4>Invested Amount</h4>
        <h2 id="invested">$0.00</h2>
      </div>

      <div class="card">
        <h4>P&L Gain</h4>
        <h2 class="green" id="pnl-card">$0.00 (<span id="pnl-percent">0%</span>)</h2>
      </div>

      <!-- MAIN TRADING ACCOUNT CURRENT TRADES -->
      <div class="card">
        <h4>Main Trading Account</h4>
        <p style="font-size: 0.75rem; color: #aaa; margin: 0 0 10px 0;">Current Trades</p>
        
        <div id="trades-container" class="trades-list">
          <!-- Live perpetual trades render here -->
        </div>
      </div>

      <!-- LOGOUT BUTTON -->
      <button class="btn btn-danger" onclick="logout()">Log Out</button>
    </div>

    <!-- Right Area: Chart -->
    <div class="chart-box">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div id="tradingview_12345" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget(
          {
            "autosize": true,
            "symbol": "CRYPTOCAP:TOTAL", 
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_12345",
            "withdateranges": true,
            "hide_side_toolbar": false,
            "save_image": true,
            "details": true,
            "hotlist": true,
            "calendar": true,
            "news": ["headlines"],
            "show_popup_button": true,
            "popup_width": "1000",
            "popup_height": "650",
            "studies": [
              "RSI@tv-basicstudies",
              "MASimple@tv-basicstudies"
            ]
          }
          );
          </script>
        </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
