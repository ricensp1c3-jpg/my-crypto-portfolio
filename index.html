<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <!-- DANCING BABY SHARK FAVICON -->
  <link rel="icon" href="https://media.giphy.com/media/13ByGacS3R3k40/giphy.gif" type="image/gif">
  <link rel="shortcut icon" href="https://media.giphy.com/media/13ByGacS3R3k40/giphy.gif" type="image/gif">

  <title>TradEaTravel Pro</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- TradingView Library (Required for charts to load) -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

  <style>
    :root {
      --bg-main: #0b0e11;
      --bg-card: #181a20;
      --bg-card-hover: #1e2329;
      --border-color: #2b313a;
      --text-main: #eaecef;
      --text-muted: #848e9c;
      --green: #0ecb81;
      --green-bg: rgba(14, 203, 129, 0.12);
      --red: #f6465d;
      --red-bg: rgba(246, 70, 93, 0.12);
      --accent: #f0b90b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      width: 100vw;
    }

    /* Layout */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      flex-direction: row;
      overflow: hidden;
    }

    /* Sidebar Area */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      overflow-y: auto;
      z-index: 10;
    }

    /* Header & Title */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .site-logo {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-color);
    }

    .brand-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-main);
      line-height: 1.2;
      flex-grow: 1;
    }

    /* Upper Right Logout Button (Mobile Only) */
    .btn-logout-mobile {
      display: none;
      background: rgba(246, 70, 93, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* Trades Section */
    .section-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 4px;
      box-shadow: 0 0 6px var(--green);
    }

    .trades-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .trade-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .trade-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .symbol-name {
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 700;
    }

    .badge-long { background: var(--green-bg); color: var(--green); }
    .badge-short { background: var(--red-bg); color: var(--red); }
    
    .badge-active { border: 1px solid var(--green); color: var(--green); }
    .badge-inactive { border: 1px solid var(--text-muted); color: var(--text-muted); }

    .trade-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .price-text {
      color: var(--text-muted);
      font-family: monospace;
    }

    .pnl-text {
      font-weight: 700;
      font-family: monospace;
    }

    .green { color: var(--green); }
    .red { color: var(--red); }

    /* Desktop Chart Panel */
    .chart-box {
      flex-grow: 1;
      height: 100%;
      background: var(--bg-main);
      position: relative;
    }

    /* Desktop Bottom Logout Button */
    .btn-logout-desktop {
      margin-top: auto;
      background: rgba(246, 70, 93, 0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
    }

    /* Embedded Mobile Chart Section */
    .mobile-chart-section {
      display: none;
      width: 100%;
      height: 420px;
      margin-top: 10px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
      touch-action: auto !important;
    }

    /* Responsive Mobile Overrides */
    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }

      .app-container {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .sidebar {
        width: 100%;
        min-width: 100%;
        height: auto;
        border-right: none;
        overflow: visible;
      }

      .chart-box {
        display: none;
      }

      .mobile-chart-section {
        display: block;
      }

      .btn-logout-desktop {
        display: none;
      }

      .btn-logout-mobile {
        display: block;
      }
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 14, 17, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      width: 300px;
      text-align: center;
    }

    .auth-card input {
      width: 100%;
      padding: 8px 10px;
      margin: 6px 0;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .btn-auth {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-top: 10px;
      cursor: pointer;
    }

    .auth-toggle {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 12px;
      display: block;
      cursor: pointer;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- AUTHENTICATION OVERLAY -->
  <div id="auth-modal" class="auth-overlay">
    <div class="auth-card">
      <h3 id="auth-title" style="color: var(--text-main); margin-bottom: 4px;">Sign In</h3>
      <p style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 12px;" id="auth-sub">Access your trading account</p>
      
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Password">
      <input type="text" id="auth-username" placeholder="Username" class="hidden">

      <button id="auth-btn" class="btn-auth">Log In</button>
      <span class="auth-toggle" id="auth-toggle">Create an account</span>
    </div>
  </div>

  <!-- MAIN TERMINAL APP -->
  <div class="app-container">
    
    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
      
      <!-- HEADER WITH LOGOUT BUTTON AT UPPER RIGHT FOR MOBILE -->
      <div class="brand-header">
        <img src="images/tradeatravel.jpg" alt="Logo" class="site-logo">
        <span class="brand-title" id="account-title">Trading Account</span>
        
        <!-- MOBILE LOGOUT BUTTON (UPPER RIGHT) -->
        <button class="btn-logout-mobile" onclick="logout()">LOG OUT</button>
      </div>

      <!-- PORTFOLIO STATS GRID -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Invested</div>
          <div class="stat-value" id="invested">$0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total P&L</div>
          <div class="stat-value green" id="pnl-card">$0.00</div>
        </div>
      </div>

      <!-- ACTIVE TRADES LIST -->
      <div class="section-title">
        <span><span class="live-dot"></span>Active Positions</span>
        <span style="font-size: 0.65rem; color: var(--text-muted);">BINANCE LIVE</span>
      </div>

      <div id="trades-container" class="trades-list">
        <!-- Live WebSocket Trades Render Here -->
      </div>

      <!-- EMBEDDED MOBILE CHART -->
      <div class="mobile-chart-section">
        <div class="section-title" style="margin-bottom: 8px;">
          <span>Live Interactive Chart</span>
        </div>
        <div class="tradingview-widget-container" style="height:380px;width:100%">
          <div id="tradingview_mobile" style="height:100%;width:100%"></div>
        </div>
      </div>

      <!-- DESKTOP LOGOUT BUTTON -->
      <button class="btn-logout-desktop" onclick="logout()">Log Out</button>
    </div>

    <!-- DESKTOP RIGHT CHART CONTAINER -->
    <div class="chart-box">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tradingview_desktop" style="height:100%;width:100%"></div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
